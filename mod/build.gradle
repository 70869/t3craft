plugins {
	// Minecraft 26.x is unobfuscated: the non-remapping Loom plugin is used (no mappings, no remapJar).
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

// Resolve the user's existing Prism instance; explicit game directories also let QA
// stay isolated. Read only InstanceDir from launcher settings, never account data.
def explicitGameDir = providers.gradleProperty("t3craftGameDir")
	.orElse(providers.environmentVariable("T3CRAFT_GAME_DIR")).orNull
def explicitPrismData = providers.gradleProperty("t3craftPrismData")
	.orElse(providers.environmentVariable("T3CRAFT_PRISM_DATA")).orNull
def userHome = System.getProperty("user.home")
def prismRoots = explicitPrismData ? [file(explicitPrismData)] : [
	System.getenv("APPDATA") ? new File(System.getenv("APPDATA"), "PrismLauncher") : null,
	new File(userHome, "Library/Application Support/PrismLauncher"),
	new File(System.getenv("XDG_DATA_HOME") ?: new File(userHome, ".local/share").path, "PrismLauncher"),
	new File(userHome, ".var/app/org.prismlauncher.PrismLauncher/data/PrismLauncher")
].findAll { it != null }
def nativeGameDir = prismRoots.collect { root ->
	def settings = new File(root, "prismlauncher.cfg")
	def setting = settings.isFile() ? settings.readLines().find { it.startsWith("InstanceDir=") } : null
	def instancePath = setting ? setting.substring("InstanceDir=".length()) : "instances"
	def instances = new File(instancePath)
	if (!instances.isAbsolute()) instances = new File(root, instancePath)
	def instance = new File(instances, "T3Craft-${project.minecraft_version}-Native")
	[".minecraft", "minecraft"].collect { new File(instance, it) }.find { it.isDirectory() }
}.find { it != null }
def devGameDir = explicitGameDir ? file(explicitGameDir) : (nativeGameDir ?: file("run"))

loom {
	splitEnvironmentSourceSets()

	mods {
		"agentcraft" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			// Dev run: offline player named after you (AGENTCRAFT_PLAYER, else the OS user name), 1080p
			// window. World auto-load/creation, mute and focus behaviour are handled by the mod itself
			// (see mod/DEV.md).
			def player = (System.getenv("AGENTCRAFT_PLAYER") ?: System.getProperty("user.name") ?: "Player").replaceAll(/[^A-Za-z0-9_]/, "").take(16) ?: "Player"
			programArgs "--username", player, "--width", "1920", "--height", "1080"
			// FFM (java.lang.foreign) is used by the DevBridge for a read-only OS focus check.
			vmArgs "-Xmx4G", "--enable-native-access=ALL-UNNAMED"
			runDir devGameDir.absolutePath
		}
		server {
			runDir "run/server"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// DevBridge WebSocket server. slf4j-api is already provided by Minecraft, so only the
	// websocket jar itself is nested (jar-in-jar).
	clientImplementation("org.java-websocket:Java-WebSocket:${project.java_websocket_version}") {
		exclude group: 'org.slf4j'
	}
	include("org.java-websocket:Java-WebSocket:${project.java_websocket_version}") {
		exclude group: 'org.slf4j'
	}
}

processResources {
	def version = project.version
	def metadata = [version: version, minecraft_version: project.minecraft_version,
		loader_version: project.loader_version, fabric_api_version: project.fabric_api_version, java_version: project.java_version]
	inputs.properties metadata

	filesMatching("fabric.mod.json") {
		expand metadata
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = Integer.parseInt(project.java_version)
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.toVersion(project.java_version)
	targetCompatibility = JavaVersion.toVersion(project.java_version)
}
tasks.named('jar') {
	from('../LICENSE') { into 'META-INF' }
	from('../licenses/t3craft-client-MIT.txt') { into 'META-INF' }
	from('../licenses/t3code-MIT.txt') { into 'META-INF' }
	from('../THIRD-PARTY-NOTICES.md') { into 'META-INF' }
}

// Plain-JVM integration checks exercise the same paired client used in Minecraft.
sourceSets {
	smoke {
		java.srcDir 'src/smoke/java'
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output + sourceSets.client.compileClasspath + sourceSets.client.output
		runtimeClasspath += compileClasspath + sourceSets.main.runtimeClasspath + sourceSets.client.runtimeClasspath
	}
}
tasks.register('featureCheck', JavaExec) {
	classpath = sourceSets.smoke.runtimeClasspath
	mainClass = 'dev.agentcraft.client.t3.FeatureChecks'
	args = [project.findProperty('fixturePort') ?: '25680']
}
tasks.register('connectionCheck', JavaExec) {
	classpath = sourceSets.smoke.runtimeClasspath
	mainClass = 'dev.agentcraft.client.t3.ConnectionChecks'
	args = [project.findProperty('fixturePort') ?: '25680']
}
tasks.register('officeCheck', JavaExec) {
	classpath = sourceSets.smoke.runtimeClasspath
	mainClass = 'dev.agentcraft.client.t3.OfficeChecks'
}
tasks.register('studioCheck', JavaExec) {
	classpath = sourceSets.smoke.runtimeClasspath
	mainClass = 'dev.agentcraft.client.t3.StudioChecks'
}
tasks.register('hqLayoutCheck', JavaExec) {
	classpath = sourceSets.smoke.runtimeClasspath
	mainClass = 'dev.agentcraft.hq.HqLayoutChecks'
}
tasks.register('worldTemplateExport', JavaExec) {
	classpath = sourceSets.smoke.runtimeClasspath
	mainClass = 'dev.agentcraft.hq.WorldTemplateExport'
	args = [project.findProperty('worldSource') ?: '', file('../release').absolutePath, project.minecraft_version]
}
tasks.register('prepareNpcWorldFixture', JavaExec) {
	classpath = sourceSets.smoke.runtimeClasspath
	mainClass = 'dev.agentcraft.world.HqWorldFixture'
	args = [project.findProperty('worldTemplate') ?: file('../release/world-template.zip').absolutePath,
		project.findProperty('fixtureGame') ?: file('../.local/npc-world-identity/game').absolutePath]
}
tasks.register('nativeProbe', JavaExec) {
	classpath = sourceSets.smoke.runtimeClasspath
	mainClass = 'dev.agentcraft.client.t3.NativeProbe'
	args = [project.findProperty('config') ?: '../.agentcraft-home/native-t3/t3craft.json']
}

// Explicit opt-in: check-terminal-live.ps1 owns an isolated server/home and private grant.
tasks.register('terminalLiveCheck', JavaExec) {
	classpath = sourceSets.smoke.runtimeClasspath
	mainClass = 'dev.agentcraft.client.t3.TerminalLiveChecks'
	args = [project.findProperty('terminalGrant') ?: '', project.findProperty('terminalOrigin') ?: '', project.findProperty('terminalWorkspace') ?: '']
}
tasks.register('writeCheck', JavaExec) {
	classpath = sourceSets.smoke.runtimeClasspath
	mainClass = 'dev.agentcraft.client.t3.WriteChecks'
	args = [project.findProperty('fixturePort') ?: '25680']
}
tasks.register('workflowCheck', JavaExec) {
	classpath = sourceSets.smoke.runtimeClasspath
	mainClass = 'dev.agentcraft.client.t3.WorkflowChecks'
	args = [project.findProperty('fixturePort') ?: '25680']
}
tasks.named('workflowCheck') { mustRunAfter('connectionCheck', 'featureCheck', 'writeCheck') }
tasks.named('check') { dependsOn('officeCheck', 'studioCheck', 'hqLayoutCheck') }

// These checks mutate the same isolated fixture, so never execute them concurrently.
tasks.named('featureCheck') { mustRunAfter('connectionCheck') }
tasks.named('writeCheck') { mustRunAfter('connectionCheck', 'featureCheck') }

// Seed mod/run with a dev options.txt (muted, 1080p-friendly GUI scale, no onboarding/tutorial
// noise, no pause on focus loss). Only copied when mod/run/options.txt does not exist yet, so
// changes made in-game persist. Delete mod/run/options.txt to reset.
def runOptionsFile = file("run/options.txt")
def isolatedDefaultRun = devGameDir.canonicalFile == file("run").canonicalFile
def prepareRunDir = tasks.register("prepareRunDir", Copy) {
	from("run-template")
	into("run")
	onlyIf("isolated default run directory without options.txt") { isolatedDefaultRun && !runOptionsFile.exists() }
}

tasks.register("gameDirectory") {
	group = "agentcraft"
	description = "Print the runClient game directory without launching Minecraft"
	def selectedDirectory = devGameDir.absolutePath
	doLast { println("Minecraft game directory: " + selectedDirectory) }
}

tasks.matching { it.name == "runClient" }.configureEach {
	dependsOn(prepareRunDir)
}

// Unpack the decompiled Minecraft sources into build/mcsrc so agents can grep real 26.3 APIs
// (`gradlew mcSources`, then search mod/build/mcsrc/net/minecraft/...). Minecraft 26.x is
// unobfuscated, so these are Mojang's real names.
tasks.register("mcSources", Sync) {
	group = "agentcraft"
	description = "Decompile (genSources) and unpack Minecraft sources into build/mcsrc"
	dependsOn("genSources")
	notCompatibleWithConfigurationCache("reads Loom's cache directory at execution time")
	def loomCache = file(".gradle/loom-cache/minecraftMaven")
	from {
		fileTree(loomCache) { include "**/*-sources.jar" }.files.collect { zipTree(it) }
	}
	into(layout.buildDirectory.dir("mcsrc"))
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
