name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Verify ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Fabric mod
        run: ./gradlew build
        working-directory: mod
        if: runner.os != 'Windows'
      - name: Build Fabric mod (Windows)
        run: .\gradlew.bat build
        working-directory: mod
        if: runner.os == 'Windows'
      - name: Validate Prism release package
        run: python3 tools/package-prism.py --output-dir .local/prism-check
        if: runner.os == 'Linux'

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Confirm release tag matches project version
        shell: bash
        run: |
          version="$(sed -n 's/^mod_version=//p' mod/gradle.properties)"
          test "$GITHUB_REF_NAME" = "v$version"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build release JAR
        run: ./gradlew build
        working-directory: mod
      - name: Package Prism import
        run: python3 tools/package-prism.py
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/prism/T3Craft-26.3-Native.zip "mod/build/libs/t3craft-$RELEASE_VERSION.jar" --title "T3Craft $RELEASE_VERSION" --generate-notes --verify-tag
