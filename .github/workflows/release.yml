name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Verify ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - id: target
        shell: bash
        run: echo "java=$(sed -n 's/^java_version=//p' mod/gradle.properties)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.target.outputs.java }}
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build Fabric mod
        run: ./gradlew build
        working-directory: mod
        if: runner.os != 'Windows'
      - name: Build Fabric mod (Windows)
        run: .\gradlew.bat build
        working-directory: mod
        if: runner.os == 'Windows'
      - name: Validate Prism release package
        run: python tools/package-prism.py --output-dir .local/prism-check
      - name: Validate Modrinth pack and matching authored world
        run: python tools/package-modrinth.py .local/prism-check/T3Craft-Prism.zip
      - name: Check package privacy and compatibility regressions
        run: python -m unittest discover -s tools -p test_release_package.py
      - name: Check installer and update recovery in disposable profiles
        run: python tools/check-installation.py --package .local/prism-check/T3Craft-Prism.zip
        if: runner.os == 'Windows'
      - name: Check paired-client protocol compatibility
        run: python tools/check-workflows.py

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: target
        shell: bash
        run: echo "java=$(sed -n 's/^java_version=//p' mod/gradle.properties)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.target.outputs.java }}
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Confirm release tag matches project version
        shell: bash
        run: |
          version="$(sed -n 's/^mod_version=//p' mod/gradle.properties)"
          tag="v$version"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # Recover a failed check without rewriting an already-pushed tag.
            # Only QA, docs and marketing may differ from its release sources.
            git rev-parse --verify "refs/tags/$tag"
            git diff --exit-code "$tag" HEAD -- mod release tools/package-prism.py tools/package-modrinth.py tools/install-release.ps1 tools/update-release-after-close.ps1 Install-T3Craft.cmd
          else
            test "$GITHUB_REF_NAME" = "$tag"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "MINECRAFT_VERSION=$(sed -n 's/^minecraft_version=//p' mod/gradle.properties)" >> "$GITHUB_ENV"
      - name: Build release JAR
        run: ./gradlew build
        working-directory: mod
      - name: Package Prism import
        run: python3 tools/package-prism.py
      - name: Package Modrinth import
        run: python3 tools/package-modrinth.py artifacts/prism/T3Craft-Prism.zip
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(
            "artifacts/prism/T3Craft-$RELEASE_VERSION-mc$MINECRAFT_VERSION-fabric.zip"
            artifacts/prism/T3Craft-Prism.zip
            "artifacts/prism/T3Craft-$MINECRAFT_VERSION-Native.zip"
            artifacts/prism/T3Craft-Windows-Installer.zip
            "artifacts/prism/T3Craft-$RELEASE_VERSION.mrpack"
            artifacts/prism/compatibility.json
            artifacts/prism/SHA256SUMS.txt
            "mod/build/libs/t3craft-$RELEASE_VERSION.jar"
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            existing_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
            missing_assets=()
            for asset in "${assets[@]}"; do
              name="${asset##*/}"
              if ! grep -Fxq -- "$name" <<<"$existing_assets"; then
                missing_assets+=("$asset")
              fi
            done
            if ((${#missing_assets[@]})); then
              gh release upload "$RELEASE_TAG" "${missing_assets[@]}"
            fi
            gh release edit "$RELEASE_TAG" --title "T3Craft $RELEASE_VERSION" --notes-file "docs/RELEASE-$RELEASE_VERSION.md"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --title "T3Craft $RELEASE_VERSION" --notes-file "docs/RELEASE-$RELEASE_VERSION.md" --verify-tag
          fi
